[package]
name = "sshl"
description = "SSHL — 原生 SSH 客户端"
version.workspace = true
authors.workspace = true
license.workspace = true
edition = "2024"

[features]
# 开发测试口（见 src/devhook.rs）：debug 构建自带；release 要测时 `--features devhook`，正式构建不带。
devhook = []

[dependencies]
sshl-core = { path = "../core" }

# GPUI（Zed 的 GPU 界面框架）。gpui-pre 每周发版、常有破坏性改动，版本钉死；gpui-base 必须与之配套。
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
# 只用行为层（输入框、焦点、弹层、虚拟列表）。不用带样式的 gpui-component：它初始化时枚举全部系统字体，冷启动多 ~170ms。
gpui-base = "=0.9.1"
# gpui 的无障碍树用的就是它（同一版本，不多编一份）；gpui 没重新导出 ActionData，终端收「设置值」动作要用。
accesskit = "0.24.1"
# 给 GPUI 的窗口类补「焦点元素」转发（见 main.rs）；同 gpui 用的那一版。
accesskit_macos = "0.26.3"
# 启动时自己问一次窗口的焦点元素，把无障碍树提前建好（见 main.rs）；gpui 已经带着这一版。
objc2 = "0.6"

# 终端模拟：Ghostty 内核 libghostty-vt（C ABI 1.0）。构建要 Zig 0.17（brew install zig）。
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "768add93c54ccdba3f5c4d8763789ab6416f3151" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# 只读旧版 WebView 的 localStorage（迁移设置）；版本与 sshl-core 一致，不多编一份 SQLite。
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
